<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="product.css">
    <title>Product Page</title>

<body>

    
    <div id="navbar">

        <a class="main_logo" href="#">SHOPCART.in</a>

        <div class="location_div">
            <p class="deliver">Delivering to cities</p>

            <div class="location" > 

                <img class="location_logo"   src="images\placeholder.png" alt="location logo"> 
                <p class="updatelocation"><b>Update Location</b></p>
            </div>
        </div>
        <div class="search_bar">
            <select class="category">
                <option value="all">All</option>
                <option value="Fashion">Fashion</option>
                <option value="Beauty ">Beauty </option>
                <option value="Electronic ">Electronic </option>

            </div>

            <select class="lang">
                <option value="english">english</option>
            </select>
        </div>

        <div class="sign_div">
            <a class="sign_in" href="#">Hello,<br><b>sign in</b></a>
        </div>

        <div class="return_div">
            <p class="return">Return<br><b> & Orders </b></p>
        </div>

        <div class="cart">
            <a href="#"><img class="cart_logo" src="images\trolley.png"></a>
        </div>
    </div>

    
    <div id="category">
        <a class="opt" href="index.html">Homepage</a>
        <a class="opt" href="product.html?category=shoes">Shoes</a>
        <a class="opt" href="product.html?category=cloths">Cloths</a>
        <a class="opt" href="product.html?category=toys">Toys</a>
        <a class="opt" href="product.html?category=laptops">Laptops</a>
        <a class="opt" href="product.html?category=electronics">Electronics</a>
        <a class="opt" href="product.html?category=furniture">Furniture</a>
        <a class="opt" href="product.html?category=cosmetics">Cosmetics</a>
