<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="navbar">

        <a class="main_logo" href="#">SHOPCART.in</a>

        <div class="location_div">
            <p class="deliver">Delivering to cities</p>

            <div class="location" > 

                <img class="location_logo"   src="images\placeholder.png" alt="location logo"> 
                <p class="updatelocation"><b>Update Location</b></p>
            </div>
        </div>
        <div class="search_bar">
            <select class="category">
                <option value="all">All</option>
                <option value="Fashion">Fashion</option>
                <option value="Beauty ">Beauty </option>
                <option value="Electronic ">Electronic </option>
                <option value="Toys">Toys</option>
                <option value="Furniture">Furniture</option>
            </select>

            <input class="search" placeholder="Search Anything">
            <div class="search_div">
                <img class="search_logo" src="images\search.png">
            </div>
        </div>

        <div class="lang_div">
            <img class="india_logo" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTz-BRKeKzjuXVdAqwQAHpUETM0e2tMfifCyVzN0FSaZw&s">
            <select class="lang">
                <option value="english">english</option>
            </select>
        </div>

        <div class="sign_div">
            <a class="sign_in" href="#">Hello,<br><b>sign in</b></a>
        </div>

        <div class="return_div">
            <p class="return">Return<br><b> & Orders </b></p>
        </div>

        <div class="cart">
            <img class="cart_logo" src="https://uxwing.com/wp-content/themes/uxwing/download/e-commerce-currency-shopping/shopping-cart-white-icon.png">
        </div>
    </div>

    <div id="category">
        <a class="opt" href="#">Pay</a>
        <a class="opt" href="#">Mobiles</a>
        <a class="opt" href="#">Coupons</a>
        <a class="opt" href="#">Flights</a>
        <a class="opt" href="#">Computers</a>
        <a class="opt" href="#">Electronics</a>
        <a class="opt" href="#">New Release</a>
        <a class="opt" href="#">Video Games</a>
    </div>







    

    <script src="app.js"></script>
</body>
</html>
