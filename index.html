<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="navbar">

        <a class="main_logo" href="#">SHOPCART.in</a>

        <div class="location_div">
            <p class="deliver">Delivering to cities</p>

            <div class="location" > 

                <img class="location_logo"   src="placeholder.png" alt="location logo"> 
                <p class="updatelocation">Update Location</p>
            </div>
        </div>
        <div class="search_bar">
            <select class="category">
                <option value="all">All</option>
                <option value="Fashion">Fashion</option>
                <option value="Beauty Products">Beauty Products</option>
                <option value="Electronic Devices">Electronic Devices</option>
                <option value="Playing Toys">Playing Toys</option>
                <option value="Furniture">Furniture</option>
            </select>

            <input class="search" placeholder="search anything">
            <div class="search_div"><img class="search_logo" src="search.png"></div>

        </div>
    
    



    </div>



    

    <script src="app.js"></script>
</body>
</html>
